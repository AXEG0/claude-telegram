name: Telegram plugin tests

# Runs the Telegram plugin's own suite on every pull request and on main, so a
# merge into main rests on it. Required on main by the branch ruleset, so it
# runs without a path filter: a required check that never reports would block
# every pull request outside the plugin.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: telegram-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bun-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: external_plugins/telegram
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (sha-pinned)
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The running-server tests drive their servers' clock (fixtures/clock.ts)
      # instead of waiting out real timers. The suite's bound is 3 minutes: a
      # run that reaches it fails this step. Every run prints its time and the
      # runner's processors, and a failing test still fails the step.
      - name: bun run test, within 3 minutes
        run: |
          lscpu
          bound_ms=180000
          start=$(date +%s%N)
          status=0
          bun run test || status=$?
          took_ms=$(( ($(date +%s%N) - start) / 1000000 ))
          took="$((took_ms / 1000)).$(printf '%03d' $((took_ms % 1000)))"
          if [ "$took_ms" -ge "$bound_ms" ]; then
            echo "::error title=Test suite over its bound::The suite took ${took} s on $(nproc) cores; its bound is $((bound_ms / 1000)) s."
            exit 1
          fi
          echo "The suite took ${took} s on $(nproc) cores, within its $((bound_ms / 1000)) s bound."
          exit "$status"
