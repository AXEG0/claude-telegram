name: Telegram plugin tests

# Throwaway, not for merge: sixteen runners each run the press and held-edit
# tests in six processes at once, half with the press released after a fixed
# wait and half once the server has said it is shutting down.

# Runs the Telegram plugin's own suite on every pull request and on main, so a
# merge into main rests on it. Required on main by the branch ruleset, so it
# runs without a path filter: a required check that never reports would block
# every pull request outside the plugin.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: telegram-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bun-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arm: [wait300, shutdownline]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: external_plugins/telegram
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (sha-pinned)
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: the press and held-edit tests, six at once
        env:
          ARM: ${{ matrix.arm }}
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)):'
          if [ "$ARM" = wait300 ]; then
            python3 - <<'PY'
          p = 'buttons.integration.test.ts'
          s = open(p).read()
          b = """    // The press is judged once the server has seen its input close.
              await until(() => first.stderr().includes('telegram channel: shutting down'))
          """
          a = """    await wait(300)
          """
          assert s.count(b) == 1
          open(p, 'w').write(s.replace(b, a))
          PY
          fi
          git diff --stat
          for i in 1 2 3 4 5 6; do
            mkdir -p "$RUNNER_TEMP/p$i"
            TMPDIR="$RUNNER_TEMP/p$i" bun test buttons.integration.test.ts -t 'press being judged|held keyboard edit' --rerun-each 40 > "press-$i.log" 2>&1 &
          done
          wait
          failed=0
          for f in press-*.log; do
            echo "$f: $(grep -c '^(pass)' "$f") passed, $(grep -c '^(fail)' "$f") failed"
            grep '^(fail)' "$f" | cut -c1-110 | sort | uniq -c
            grep -E '^error' "$f" | cut -c1-110 | sort | uniq -c
            grep -q '^(fail)' "$f" && failed=1
          done
          exit $failed
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arm }}-${{ matrix.shard }}
          path: external_plugins/telegram/press-*.log
          retention-days: 1
